<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tu comprobante · RutaÓptima Pro</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f9f4;color:#103b2b;font:16px/1.45 'Segoe UI',Arial,sans-serif}main{max-width:540px;margin:auto;padding:30px 20px 48px}.brand{display:flex;align-items:center;justify-content:center;gap:11px;font-size:24px;font-weight:800}.brand svg{width:48px;height:48px}.brand span{color:#098655}.success{text-align:center;margin:30px 0 23px}.check{display:grid;place-items:center;background:#12a65c;color:white;border-radius:50%;width:76px;height:76px;font-size:48px;font-weight:700;margin:auto}.success h1{font-size:clamp(29px,8vw,40px);line-height:1.1;margin:16px 0 10px}.badge{display:inline-block;border-radius:30px;background:#dff5e3;color:#16663e;padding:7px 15px;font-size:13px;font-weight:700}.card{background:white;border:1px solid #e4f0e8;border-radius:20px;box-shadow:0 12px 32px #183f2910;padding:22px}.card h2{font-size:20px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px solid #edf3ee}.row span{color:#648071}.row strong{text-align:right;overflow-wrap:anywhere}.total{margin-top:14px;background:#e9f9eb;border-radius:12px;padding:14px;font-size:21px;font-weight:800;display:flex;justify-content:space-between}.status{margin-top:20px;padding:18px;background:#e3f7e6;border-radius:16px}.status strong{display:block;font-size:18px}.status p{margin:5px 0;color:#426c52}.note{text-align:center;color:#71887b;font-size:12px;margin-top:25px}.error{padding:22px;text-align:center;background:white;border-radius:16px}button{border:0;border-radius:12px;background:#07834c;color:white;font-size:16px;font-weight:700;padding:14px;width:100%;margin-top:20px;cursor:pointer}@media print{body{background:white}button{display:none}main{padding:10px}}
</style></head><body><main><div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="19" fill="#70e5b1"/><path d="M15 43c9-1 6-15 16-15 5 0 6 4 10 3 4-1 5-5 6-8" fill="none" stroke="#10483b" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 4"/><circle cx="16" cy="43" r="4" fill="#10483b"/><path d="M48 12c-6 0-10 4-10 10 0 7 10 15 10 15s10-8 10-15c0-6-4-10-10-10zm0 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8z" fill="#10483b"/></svg><div>Ruta<span>Óptima</span> Pro</div></div><div id="content"><div class="success"><div class="check">✓</div><h1>¡Compra exitosa!</h1><div class="badge">Pago simulado · Demostración</div></div><section class="card"><h2 id="orderTitle"></h2><div id="details"></div><div class="total"><span>Total</span><span id="total"></span></div></section><div class="status"><strong>Tu pedido está confirmado</strong><p id="tracking">Conductor: pendiente de asignación</p></div><button type="button" onclick="window.print()">Guardar o imprimir comprobante</button><button type="button" onclick="location.href='pedido.html'" style="background:#e4f5ea;color:#14663e;margin-top:10px">Hacer otro pedido</button><p class="note">Comprobante de demostración. No se ha realizado ningún cobro real ni es una factura fiscal.</p></div><p id="error" class="error" hidden>No se encontraron los datos de este comprobante.</p></main><script>
const defaults={'RO-01':['Carlos Paredes','PBA-1041'],'RO-02':['Ana Torres','PBA-2082'],'RO-03':['Luis Herrera','PBA-3093'],'RO-04':['María Ruiz','PBA-4104'],'RO-05':['Jorge Vega','PBA-5115']};
let data;
try{data=JSON.parse(decodeURIComponent(location.hash.slice(1)));if(!Array.isArray(data)||![9,10].includes(data.length))throw Error()}catch{document.getElementById('content').hidden=true;document.getElementById('error').hidden=false}
function update(){if(!data)return;document.getElementById('orderTitle').textContent='Pedido #'+data[0];const details=document.getElementById('details');details.replaceChildren();[['Cliente',data[1]],['Envío',data[2]],['Recogida',data[3]],...(data[9]?[['Recibe',data[9]]]:[]),['Destino',data[4]+' · '+data[5]],['Entrega',data[6]+' · '+data[7]],['Prioridad',data[8]===8?'Prioritaria':'Normal']].forEach(([k,v])=>{let row=document.createElement('div'),label=document.createElement('span'),value=document.createElement('strong');row.className='row';label.textContent=k;value.textContent=v;row.append(label,value);details.append(row)});document.getElementById('total').textContent='$'+Number(data[8]).toFixed(2);try{let orders=JSON.parse(localStorage.getItem('rutaoptima_orders_v1')||'[]'),fleet=JSON.parse(localStorage.getItem('rutaoptima_fleet_v1')||'{}'),o=orders.find(x=>x.id===data[0]);if(o){let v=o.vehicle,d=fleet[v]||{},base=defaults[v]||[];document.getElementById('tracking').textContent='Estado: '+o.status+' · '+(v?'Conductor: '+(d.driver||base[0]||'No registrado')+' · Placa: '+(d.plate||base[1]||'No registrada'):'Conductor: pendiente de asignación')}else document.getElementById('tracking').textContent='Para consultar la asignación en esta demostración, abre el comprobante en el navegador donde se creó el pedido.'}catch{}}
window.addEventListener('storage',update);update();
</script></body></html>
